name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/package.mjs "$RUNNER_TEMP/room-builder-package/3d-room-builder-skill"
      - run: node scripts/release-check.mjs "$RUNNER_TEMP/room-builder-package/3d-room-builder-skill"
